[env:knob]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
; The stock 16 MB layout with a FAT data partition, 9.9 MB of it, which the
; firmware shows to a host as a drive; see src/hardware/drive.cpp.
board_build.partitions = app3M_fat9M_16MB.csv
board_build.filesystem = fatfs
; The built-in palette, die table and the drive's README, embedded verbatim;
; see src/builtin_files.h.
board_build.embed_txtfiles =
    data/theme.json
    data/layout.json
    data/README.txt
; The firmware runs the S3's USB OTG peripheral under TinyUSB so it can show
; the data partition as a drive beside the serial port. Uploading touches the
; port at 1200 baud, which the core answers by rebooting into the ROM
; bootloader, and that enumerates as a new serial device to flash through.
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
lib_deps = adafruit/Adafruit DRV2605 Library@^1.2.4
build_unflags = -Os -DARDUINO_USB_MODE=1
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -O2
    -Isrc
    -Ilib/jsmn
