[env:knob]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
lib_deps = adafruit/Adafruit DRV2605 Library@^1.2.4
build_unflags = -Os
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -O2
    -Isrc

# Same firmware with a 10 second idle timeout, so sleep can be watched without
# waiting two minutes. A flag rather than an edit, so it cannot be committed by
# accident.
[env:knob-test]
extends = env:knob
build_flags =
    ${env:knob.build_flags}
    -DIDLE_SLEEP_MS=10000
